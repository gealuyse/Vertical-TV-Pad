<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>บริการเสริม SME — AIS Vertical TV Pad V1.02n</title>
    <link rel="stylesheet" href="styles/kiosk-styles.css" />
    <script defer src="scripts/navbar.js"></script>
    <script defer src="scripts/kiosk-application.js"></script>
  </head>
  <body data-current-page="sme-addons">
    <main class="kiosk-viewport" id="viewport">
      <div class="kiosk-scaled-container" id="wrapper">
        <div class="kiosk-canvas" id="canvas">
          <section
            class="kiosk-screen"
            id="page-sme-addons"
            data-title="บริการเสริม SME"
            data-page="sme-addons"
            tabindex="-1"
            aria-label="บริการเสริม SME"
          >
            <div class="kiosk-page">
              <div data-navbar></div>
              <div class="business-additional-services-heading">
                <h1 class="business-additional-services-page-title">
                  <span class="business-additional-services-heading__title">เลือกบริการเสริม</span>
                  <span class="business-additional-services-heading__subtitle heading-title">สำหรับลูกค้า AIS Fibre</span>
                </h1>
                <p class="business-additional-services-heading__title">
                  แคมเปญและโปรโมชัน พร้อมข้อเสนอสุดพิเศษสำหรับธุรกิจ SME โดยเฉพาะ
                </p>
              </div>
              <h2 class="visually-hidden">รายการบริการเสริม</h2>
              <div class="business-service-row">
                <div
                  aria-label="WiFi Solution (AP)"
                  class="business-service-card"
                  data-addon-id="wifi"
                  role="group"
                >
                  <div class="business-service-card__cover">
                    <div class="business-service-card__image-rotation">
                      <img
                        alt=""
                        src="assets/images/business-service-card-background.svg"
                        draggable="false"
                        class="media-layer"
                      />
                    </div>
                    <div class="business-service-card__wifi-image">
                      <img
                        alt=""
                        src="assets/images/business-wifi-service.webp"
                        draggable="false"
                        class="media-cover"
                      />
                    </div>
                  </div>
                  <h3 class="business-service-card__name heading-card">WiFi Solution (AP)</h3>
                </div>
                <div
                  aria-label="Captive Portal"
                  class="business-service-card"
                  data-addon-id="portal"
                  role="group"
                >
                  <div class="business-service-card__cover">
                    <div class="business-service-card__image-rotation">
                      <img
                        alt=""
                        src="assets/images/business-service-card-background.svg"
                        draggable="false"
                        class="media-layer"
                      />
                    </div>
                    <div class="business-service-card__portal-image">
                      <img
                        alt=""
                        src="assets/images/business-wifi-portal-service.webp"
                        draggable="false"
                        class="media-cover"
                      />
                    </div>
                  </div>
                  <h3 class="business-service-card__name heading-card">Captive Portal</h3>
                </div>
              </div>
              <div class="business-service-row">
                <div
                  aria-label="Smart Camera"
                  class="business-service-card"
                  data-addon-id="camera"
                  role="group"
                >
                  <div class="business-service-card__cover">
                    <div class="business-service-card__image-rotation">
                      <img
                        alt=""
                        src="assets/images/business-service-card-background.svg"
                        draggable="false"
                        class="media-layer"
                      />
                    </div>
                    <div class="business-service-card__camera-image">
                      <img
                        alt=""
                        src="assets/images/smart-camera-and-phone.webp"
                        draggable="false"
                        class="media-cover"
                      />
                    </div>
                  </div>
                  <h3 class="business-service-card__name heading-card">Smart Camera</h3>
                </div>
                <div
                  aria-label="Security Solution"
                  class="business-service-card"
                  data-addon-id="security"
                  role="group"
                >
                  <div class="business-service-card__cover">
                    <div class="business-service-card__image-rotation">
                      <img
                        alt=""
                        src="assets/images/business-service-card-background.svg"
                        draggable="false"
                        class="media-layer"
                      />
                    </div>
                    <div class="business-service-card__security-image">
                      <img
                        alt=""
                        src="assets/images/business-cybersecurity-service.webp"
                        draggable="false"
                        class="media-cover"
                      />
                    </div>
                  </div>
                  <h3 class="business-service-card__name heading-card">Security Solution</h3>
                </div>
              </div>
              <div class="business-service-row">
                <div
                  aria-label="Fixed IP"
                  class="business-service-card"
                  data-addon-id="ip"
                  role="group"
                >
                  <div class="business-service-card__cover">
                    <div class="business-service-card__image-rotation">
                      <img
                        alt=""
                        src="assets/images/business-service-card-background.svg"
                        draggable="false"
                        class="media-layer"
                      />
                    </div>
                    <div class="business-service-card__fixed-ip-image">
                      <img
                        alt=""
                        src="assets/images/business-fixed-ip-service.webp"
                        draggable="false"
                        class="media-cover"
                      />
                    </div>
                  </div>
                  <h3 class="business-service-card__name heading-card">Fixed IP</h3>
                </div>
                <div
                  aria-label="5G FWA Broadband"
                  class="business-service-card"
                  data-addon-id="fwa"
                  role="group"
                >
                  <div class="business-service-card__cover">
                    <div class="business-service-card__image-rotation">
                      <img
                        alt=""
                        src="assets/images/business-service-card-background.svg"
                        draggable="false"
                        class="media-layer"
                      />
                    </div>
                    <div class="business-service-card__fixed-wireless-image">
                      <img
                        alt=""
                        src="assets/images/business-fixed-wireless-service.webp"
                        draggable="false"
                        class="media-cover"
                      />
                    </div>
                  </div>
                  <h3 class="business-service-card__name heading-card">5G FWA Broadband</h3>
                </div>
              </div>
              <div class="business-additional-services-promotion-banner">
                <div class="business-additional-services-promotion-banner__image">
                  <img
                    alt=""
                    src="assets/images/additional-internet-promotions-banner.webp"
                    draggable="false"
                    class="media-cover"
                  />
                </div>
              </div>
            </div>
          </section>
          <div id="idle-root" hidden></div>
          <div class="visually-hidden" id="announcer" aria-live="polite"></div>
        </div>
      </div>
    </main>
    <noscript><p class="startup-message">ไม่สามารถเริ่มระบบได้ กรุณาติดต่อเจ้าหน้าที่</p></noscript>
  </body>
</html>
